# Builds the installers for a version tag and attaches them to a DRAFT GitHub release, which the owner
# reviews and publishes by hand. Design §10: Windows unsigned, macOS signed + notarized, Android APK;
# iOS goes through TestFlight separately (docs/release.md).
#
# Secrets (all optional; without them the build still runs, see docs/release.md):
#   APPLE_CERTIFICATE            base64 of the "Developer ID Application" .p12 (imported into a
#                                temporary keychain; signs the share extension and the app)
#   APPLE_CERTIFICATE_PASSWORD   password of that .p12
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: NAME (TEAMID)"
#   APPLE_API_ISSUER             App Store Connect API issuer id   (notarization)
#   APPLE_API_KEY                App Store Connect API key id      (notarization)
#   APPLE_API_PRIVATE_KEY        contents of that key's AuthKey_<id>.p8
#   ANDROID_KEYSTORE_BASE64      base64 of a release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# Actions are pinned to commit SHAs (decisions D36).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  TAURI_CLI: '@tauri-apps/cli@2.12.6'

jobs:
  check:
    name: tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Compare tag with desktop/src-tauri/tauri.conf.json and mobile/app.json
        run: |
          want="${TAG#v}"; want="${want%%-*}"
          desktop=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          mobile=$(jq -r .expo.version mobile/app.json)
          echo "tag $TAG → $want, desktop $desktop, mobile $mobile"
          [ "$desktop" = "$want" ] && [ "$mobile" = "$want" ]

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build NSIS installer (unsigned, design §10)
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          npx --yes "$TAURI_CLI" build --bundles nsis
          mkdir -p ../../dist
          cp ../../target/release/bundle/nsis/*-setup.exe "../../dist/kitedrop-${TAG}-windows-x64-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Signing and notarization settings (only the secrets that are set)
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KEY_ID: ${{ secrets.APPLE_API_KEY }}
          KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -n "$CERT" ] && [ -n "$IDENTITY" ]; then
            # Imported here (not by Tauri) because the share extension is signed before the app
            # (Tauri docs, "Signing in CI/CD platforms").
            kc="$RUNNER_TEMP/build.keychain"; kc_pw=$(openssl rand -hex 16)
            printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$kc_pw" "$kc"
            security set-keychain-settings -t 3600 -u "$kc"
            security unlock-keychain -p "$kc_pw" "$kc"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PW" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" > /dev/null
            kcs=("$kc")
            while read -r k; do kcs+=("$(echo "$k" | tr -d '"')"); done < <(security list-keychains -d user)
            security list-keychains -d user -s "${kcs[@]}"
            rm -f "$RUNNER_TEMP/cert.p12"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            echo "signing: Developer ID"
          else
            echo "::warning::No Developer ID secrets: the app is only ad-hoc signed and macOS Local Network permission will not work reliably (decisions D33)."
          fi
          if [ -n "$ISSUER" ] && [ -n "$KEY_ID" ] && [ -n "$KEY" ] && [ -n "$CERT" ]; then
            key_path="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
            printf '%s' "$KEY" > "$key_path"
            { echo "APPLE_API_ISSUER=$ISSUER"; echo "APPLE_API_KEY=$KEY_ID"; echo "APPLE_API_KEY_PATH=$key_path"; } >> "$GITHUB_ENV"
            echo "notarization: on"
          else
            echo "::warning::No App Store Connect API key: the app is not notarized; Gatekeeper will block the first open."
          fi
      - name: Share extension (D39)
        run: ARCHS="arm64 x86_64" scripts/build-mac-share.sh
      - name: Build universal .app and .dmg
        working-directory: desktop/src-tauri
        run: |
          npx --yes "$TAURI_CLI" build --target universal-apple-darwin --bundles app,dmg
          out=../../target/universal-apple-darwin/release/bundle
          mkdir -p ../../dist
          cp "$out"/dmg/*.dmg "../../dist/kitedrop-${TAG}-macos-universal.dmg"
          ditto -c -k --keepParent "$out/macos/kitedrop.app" "../../dist/kitedrop-${TAG}-macos-universal.zip"
      - name: Remove the notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*

  android:
    needs: check
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Rust core for Android
        run: scripts/build-mobile-core.sh android
      - name: APK (arm64)
        working-directory: mobile
        run: |
          npm ci
          CI=1 npx expo prebuild --platform android --no-install
          (cd android && ./gradlew --no-daemon -q :app:assembleRelease -PreactNativeArchitectures=arm64-v8a)
      - name: Sign with the release key (if set)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apk=mobile/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          out="dist/kitedrop-${TAG}-android-arm64.apk"
          if [ -n "$KS" ]; then
            bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
            printf '%s' "$KS" | base64 --decode > "$RUNNER_TEMP/release.jks"
            "$bt/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PW \
              --ks-key-alias "$ALIAS" --key-pass env:KEY_PW --out "$out" "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/release.jks"
            "$bt/apksigner" verify "$out"
          else
            echo "::warning::No release keystore: the APK keeps the Expo template's debug signature (docs/release.md)."
            cp "$apk" "$out"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/*

  release:
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Draft release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -- ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          args=(--repo "$REPO" --draft --title "kitedrop $TAG"
                --notes "Built by the release workflow. iOS is distributed through TestFlight. Check SHA256SUMS.txt.")
          [[ "$TAG" == *-* ]] && args+=(--prerelease)
          gh release create "$TAG" "${args[@]}" ./*
