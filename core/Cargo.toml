[package]
name = "kitedrop-core"
version = "0.1.1"
description = "Protocol, crypto and transport core of kitedrop"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "kitedrop_core"

[features]
default = ["mdns"]
# mDNS browse/advertise through raw multicast sockets. Off on iOS (no multicast entitlement;
# the app uses Bonjour through the Network framework and passes results in).
mdns = ["dep:mdns-sd"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
if-addrs = "0.15"
mdns-sd = { version = "0.22", optional = true, default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
rusqlite = { version = "0.43", features = ["bundled"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tracing = "0.1"
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hpke = { version = "0.15", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
hex = "0.4"
tempfile = "3"
rand_chacha = "0.10"
