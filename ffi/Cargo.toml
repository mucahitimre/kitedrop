[package]
name = "kitedrop-ffi"
version = "0.1.1"
description = "UniFFI bindings (Swift, Kotlin) for kitedrop-core"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "kitedrop_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
kitedrop-core = { path = "../core", default-features = false }
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
thiserror = "2"
uniffi = "0.32"

# mDNS through raw multicast sockets everywhere except iOS (no multicast entitlement there; the app
# uses Bonjour through the Network framework and calls `add_discovered`).
[target.'cfg(not(target_os = "ios"))'.dependencies]
kitedrop-core = { path = "../core", features = ["mdns"] }
